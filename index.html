<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jump Game</title>

<style>
  canvas {
    background: #f0f0f0;
    display: block;
    margin: 50px auto;
  }

  #winImg {
    display: none;
    width: 200px;
    margin: 20px auto;
  }

  #restartBtn {
    display: none;
    padding: 10px 20px;
  }

  body {
    text-align: center;
  }
</style>
</head>

<body>

<canvas id="game" width="500" height="200"></canvas>

<button id="restartBtn">重新开始</button>

<img id="winImg" src="WhatsApp 20Image 202026 2004 2024 20at 2016.43.14.jpeg">

<script>
let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let btn = document.getElementById("restartBtn");
let img = document.getElementById("winImg");

let player, obstacles;
let gameOver = false;
let win = false;
let startTime;

function init() {
  player = { x: 50, y: 150, size: 20, vy: 0, jumping: false };
  obstacles = [];
  gameOver = false;
  win = false;
  startTime = Date.now();

  btn.style.display = "none";
  img.style.display = "none";
}

init();

let gravity = 0.8;

// 跳
function jump() {
  if (!player.jumping && !gameOver && !win) {
    player.vy = -12;
    player.jumping = true;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});

document.addEventListener("touchstart", jump);

// 重开
btn.onclick = () => {
  init();
  update();
};

// 障碍
setInterval(() => {
  if (!gameOver && !win) {
    obstacles.push({ x: 500, y: 160, w: 20, h: 20 });
  }
}, 1000);

// 游戏循环
function update() {
  ctx.clearRect(0, 0, 500, 200);

  let t = (Date.now() - startTime) / 1000;

  // 地面
  ctx.fillStyle = "black";
  ctx.fillRect(0, 180, 500, 5);

  // 玩家
  player.y += player.vy;
  player.vy += gravity;

  if (player.y >= 150) {
    player.y = 150;
    player.jumping = false;
  }

  ctx.fillStyle = "blue";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  // 障碍
  ctx.fillStyle = "red";
  obstacles.forEach(o => {
    o.x -= 5;
    ctx.fillRect(o.x, o.y, o.w, o.h);

    if (
      player.x < o.x + o.w &&
      player.x + player.size > o.x &&
      player.y < o.y + o.h &&
      player.y + player.size > o.y
    ) {
      gameOver = true;
    }
  });

  // 胜利
  if (t >= 10 && !gameOver) {
    win = true;
  }

  if (gameOver || win) {
    ctx.fillStyle = "black";
    ctx.font = "28px Arial";

    if (win) {
      ctx.fillText("YOU WIN 🎉", 160, 100);

      // 显示你的照片
      img.style.display = "block";
    } else {
      ctx.fillText("GAME OVER", 150, 100);
      btn.style.display = "block";
    }

    return;
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
